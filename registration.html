<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration Form</title>

    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-primary: #334e48;
            --text-secondary: #5c756e;
            --accent-pastel: #84a9ac;
            --accent-hover: #6b8e91;
            --border-color: #e2e8e4;
            --success-color: #2a9d8f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin: 20px;
            color: var(--text-primary);
        }

        .form-card {
            background: white;
            width: 450px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-submit {
            background: var(--accent-pastel);
            color: white;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-reset {
            background: #ddd;
        }

        .btn-reset:hover {
            background: #bbb;
        }

        .success-message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            color: white;
            background: var(--success-color);
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        footer {
            margin-top: 20px;
            color: gray;
        }
    </style>

    <script>
        function validate(event) {
            event.preventDefault();

            let fname = document.getElementById("First").value.trim();
            let lname = document.getElementById("Last").value.trim();
            let roll = document.getElementById("rollNumber").value.trim();
            let email = document.getElementById("email").value.trim();
            let mobile = document.getElementById("mobile").value.trim();
            let dob = document.getElementById("dob").value;
            let branch = document.getElementById("branch").value;
            let password = document.getElementById("password").value;

            if(fname==""){
                alert("Please enter First Name");
                return false;
            }

            if(lname==""){
                alert("Please enter Last Name");
                return false;
            }

            if(roll==""){
                alert("Please enter Roll Number");
                return false;
            }

            if(email==""){
                alert("Please enter Email");
                return false;
            }

            if(mobile==""){
                alert("Please enter Mobile Number");
                return false;
            }

            if(isNaN(mobile) || mobile.length!=10){
                alert("Enter valid 10 digit Mobile Number");
                return false;
            }

            if(dob==""){
                alert("Please select Date of Birth");
                return false;
            }

            if(branch==""){
                alert("Please select Department");
                return false;
            }

            if(password.length<6){
                alert("Password must contain at least 6 characters");
                return false;
            }

            // Display success message
            document.getElementById("successMsg").style.display = "block";

            // Reset form
            document.getElementById("regForm").reset();

            return false;
        }

        function resetForm(){
            document.getElementById("successMsg").style.display="none";
        }
    </script>

</head>

<body>

<h1>Registration Form</h1>

<div class="form-card">

<form id="regForm" onsubmit="return validate(event)">

<div class="form-group">
<label>First Name</label>
<input type="text" id="First">
</div>

<div class="form-group">
<label>Last Name</label>
<input type="text" id="Last">
</div>

<div class="form-group">
<label>Gender</label>
<div class="radio-group">
<label><input type="radio" name="gender" checked> Male</label>
<label><input type="radio" name="gender"> Female</label>
</div>
</div>

<div class="form-group">
<label>Roll Number</label>
<input type="text" id="rollNumber">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="tel" id="mobile">
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" id="dob">
</div>

<div class="form-group">
<label>Department</label>
<select id="branch">
<option value="">Select Department</option>
<option value="" disabled selected>Select your department</option>
    <option value="CSE">Computer Science & Engineering</option>
    <option value="IT">Information Technology</option>
    <option value="ECE">Electronics & Communication</option>
    <option value="EEE">Electrical & Electronics</option>
    <option value="MECH">Mechanical Engineering</option>
</select>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password">
</div>

<div class="button-group">
<button type="submit" class="btn btn-submit">Submit</button>
<button type="reset" class="btn btn-reset" onclick="resetForm()">Reset</button>
</div>

<div id="successMsg" class="success-message">
✅ Registration Successful!
</div>

</form>

</div>

<footer>
<p>@ Mahatma Gandhi Institute Of Technology</p>
</footer>

</body>
</html>
